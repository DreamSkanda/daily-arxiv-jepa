name: 部署到 GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  schedule:
    # 每日北京时间中午12点（UTC 4:00）运行爬取和生成任务
    - cron: '0 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 安装 Playwright 依赖
        run: |
          npm install
          npx playwright install --with-deps chromium
          
      - name: 运行 arXiv 爬虫
        run: |
          python scripts/arxiv_crawler.py
        env:
          ARXIV_DAILY_RESULTS: 80
          ARXIV_PAGE_SIZE: 10
          ARXIV_DELAY_SECONDS: 15
          ARXIV_RETRY_BASE_SECONDS: 60
          ARXIV_MAX_RETRIES: 4

      # 先持久化抓取结果；后续摘要、图片或构建失败也不会丢失新论文。
      - name: 保存新论文数据
        id: save_papers
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers.md
          if git diff --staged --quiet; then
            echo "没有新论文需要提交"
          else
            CURRENT_DATE=$(date '+%Y-%m-%d')
            git commit -m "自动更新：保存新论文 - $CURRENT_DATE [skip ci]"
            git push
          fi

      - name: 生成论文摘要
        id: summaries
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scripts/generate_summaries.py
        env:
          MODELSCOPE_ACCESS_TOKEN: ${{ secrets.MODELSCOPE_ACCESS_TOKEN }}
          # 超时前已完成的摘要逐篇保存；未完成的仍为「待生成」。
          BATCH_WRITE_SIZE: 1
          MODELSCOPE_MODELS: moonshotai/Kimi-K3,deepseek-ai/DeepSeek-V4-Flash-0731,Tencent-Hunyuan/Hy3,stepfun-ai/Step-3.7-Flash,ZhipuAI/GLM-5.2,deepseek-ai/DeepSeek-V4-Pro

      - name: 提示摘要降级
        if: steps.summaries.outcome == 'failure'
        run: echo "::warning::摘要步骤失败或超时；新论文已保存，未完成摘要将在后续运行中重试。"

      - name: 抓取论文首图
        run: |
          python scripts/fetch_paper_images.py --max-items 30

      - name: 生成首图截图兜底队列
        run: |
          python scripts/build_paper_image_fallback_queue.py --max-items 20

      - name: Playwright 截图兜底
        run: |
          npm run paper-image:fallbacks

      - name: 注册截图兜底首图
        run: |
          python scripts/register_paper_image_fallbacks.py
          
      - name: 检查 Google Analytics 配置
        run: |
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            echo "已读取 GA_MEASUREMENT_ID（值不会打印）"
          else
            echo "未读取 GA_MEASUREMENT_ID，网站将不加载 GA4"
          fi
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 构建网站
        run: |
          python scripts/build_site.py
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}

      - name: 提交更改
        id: save_site
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers.md
          git add -f site
          if git diff --staged --quiet; then
            echo "没有更改需要提交"
          else
            CURRENT_DATE=$(date '+%Y-%m-%d')
            git commit -m "自动更新：保存摘要和网站 - $CURRENT_DATE [skip ci]"
            git push
          fi
          
      - name: 设置 Pages
        uses: actions/configure-pages@v5
        
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
